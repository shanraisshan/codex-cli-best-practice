# Copy to .github/workflows/codex-ci.yml and configure the OPENAI_API_KEY secret.
# Keep examples/ci-cd/ci-config.toml at the path below or adjust the copy step.
name: Codex CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare isolated Codex config
        run: install -D -m 600 examples/ci-cd/ci-config.toml "$RUNNER_TEMP/codex-review/config.toml"

      - name: Review changes
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.171.0'
          codex-home: ${{ runner.temp }}/codex-review
          sandbox: read-only
          codex-args: '["--ephemeral","--strict-config"]'
          prompt: >-
            Review the changes introduced by this pull request. Check correctness,
            regressions, and any changes to command examples or configuration docs.
            Report actionable findings with file and line references.

      - name: Add review to job summary
        env:
          CODEX_REVIEW: ${{ steps.codex.outputs.final-message }}
        run: printf '%s\n' "$CODEX_REVIEW" >> "$GITHUB_STEP_SUMMARY"

  test-analysis:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: hashFiles('package-lock.json') != ''
        with:
          node-version: '22'

      - name: Install dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Run tests
        id: tests
        if: hashFiles('package-lock.json') != ''
        shell: bash
        run: npm test 2>&1 | tee "$RUNNER_TEMP/codex-test-output.txt"
        continue-on-error: true

      - name: Prepare failure analysis
        if: steps.tests.outcome == 'failure'
        run: |
          install -D -m 600 examples/ci-cd/ci-config.toml "$RUNNER_TEMP/codex-tests/config.toml"
          cp "$RUNNER_TEMP/codex-test-output.txt" codex-test-output.txt

      - name: Analyze test failures
        if: steps.tests.outcome == 'failure'
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.171.0'
          codex-home: ${{ runner.temp }}/codex-tests
          sandbox: read-only
          codex-args: '["--ephemeral","--strict-config"]'
          prompt: Read codex-test-output.txt, identify the likely failure cause, and suggest focused fixes.

      - name: Report test failure
        if: always() && steps.tests.outcome == 'failure'
        env:
          CODEX_ANALYSIS: ${{ steps.codex.outputs.final-message }}
        run: |
          printf '%s\n' "$CODEX_ANALYSIS" >> "$GITHUB_STEP_SUMMARY"
          exit 1
